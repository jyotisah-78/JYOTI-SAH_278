
apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-deployment

spec:

  replicas: 2

  selector:
    matchLabels:
      app: flask


  template:

    metadata:
      labels:
        app: flask


    spec:

      containers:

      - name: flask-container

        image: ad4r5h/flask-app:latest

        imagePullPolicy: Always

        ports:

        - containerPort: 5000


        env:

        - name: DB_HOST
          value: postgres

        - name: DB_NAME
          value: testdb

        - name: DB_USER
          value: admin

        - name: DB_PASSWORD
          value: password


        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"


      restartPolicy: Always